<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe </title>

    <!-- external CSS  -->
    <link rel="stylesheet" href="styles.css"media="all">

    <!--external  javascript-->
    <script src="scripts.js" defer></script>
</head>
<body>

    <div id="gameBoard">

        <div class="row">
            <div class="gameSpace">O</div>
            <div class="gameSpace">X</div>
            <div class="gameSpace"></div>
        </div>

        <div class="row">
            <div class="gameSpace"></div>
            <div class="gameSpace">X</div>
            <div class="gameSpace"></div>
        </div>

        <div class="row">
            <div class="gameSpace"></div>
            <div class="gameSpace">O</div>
            <div class="gameSpace"></div>
        </div>

    </div>

</body>
