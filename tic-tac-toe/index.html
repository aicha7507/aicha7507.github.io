<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<link rel="stylesheet" href="styles.css">
<script src="scripts.js" defer></script>

</head>

<body>

<div id="gameContainer">

<h2 id="turnDisplay">TURN: Player X</h2>

<div id="gameBoard">

<div class="row">
<div class="gameSpace" data-row="A" data-col="0"></div>
<div class="gameSpace" data-row="A" data-col="1"></div>
<div class="gameSpace" data-row="A" data-col="2"></div>
</div>

<div class="row">
<div class="gameSpace" data-row="B" data-col="0"></div>
<div class="gameSpace" data-row="B" data-col="1"></div>
<div class="gameSpace" data-row="B" data-col="2"></div>
</div>

<div class="row">
<div class="gameSpace" data-row="C" data-col="0"></div>
<div class="gameSpace" data-row="C" data-col="1"></div>
<div class="gameSpace" data-row="C" data-col="2"></div>
</div>

</div>

<div id="gameResult">
<span></span>
</div>

<!-- ⭐ restart button -->
<button id="restartBtn">Restart Game</button>

</div>

</body>
</html>
