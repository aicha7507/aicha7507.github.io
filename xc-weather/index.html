<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XC Weather</title>

<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>

<body>

<header>
  <h1 id="location">Loading...</h1>

  <button id="changeLocationBtn">My Location</button>

  <div class="saved">
    <select id="savedCities"></select>
    <button id="resetBtn">Reset</button>
  </div>
</header>

<!-- CURRENT WEATHER -->
<section id="current-weather">

  <div id="temperature" class="temperature">--°</div>

  <div class="condition">
    <img id="currentIcon">
    <span id="currentCondition">Loading...</span>
  </div>

  <div class="details">
    <div class="wind">
      <img src="images/arrow.png" class="wind-arrow">
      <span id="windSpeed">--</span>
    </div>

    <div class="humidity">
      💧 <span id="humidity">--</span>
    </div>
  </div>

</section>

<!-- FORECAST -->
<section id="forecast">
  <h2>3-Day Forecast</h2>

  <div class="forecast-container">

    <div class="forecast-day">
      <div id="day1Name" class="day">--</div>
      <div id="day1Temp" class="temp">--</div>
      <img id="day1Icon" class="forecast-icon">
      <div id="day1Wind" class="wind">--</div>
    </div>

    <div class="forecast-day">
      <div id="day2Name" class="day">--</div>
      <div id="day2Temp" class="temp">--</div>
      <img id="day2Icon" class="forecast-icon">
      <div id="day2Wind" class="wind">--</div>
    </div>

    <div class="forecast-day">
      <div id="day3Name" class="day">--</div>
      <div id="day3Temp" class="temp">--</div>
      <img id="day3Icon" class="forecast-icon">
      <div id="day3Wind" class="wind">--</div>
    </div>

  </div>
</section>

<!-- HOURLY FORECAST -->
<section id="hourly">
  <h2>Hourly Forecast (3 Days)</h2>
  <div id="hourlyContainer"></div>
</section>

</body>
</html>
